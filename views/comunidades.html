
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Comunidades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">


<div class="container mt-4">

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Registro de comunidad</h5>
        </div>

        <div class="card-body">
            <form id="formComunidad">
                <input type="hidden" id="id_comunidad">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre"
                               class="form-control" required
                               maxlength="150">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Ubicación</label>
                        <input type="text" id="ubicacion"
                               class="form-control" maxlength="255">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Número de familias</label>
                        <input type="number" id="numero_familias"
                               class="form-control" min="0" step="1">
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn btn-primary" type="submit">
                        Guardar
                    </button>
                    <button class="btn btn-secondary" type="button"
                            onclick="limpiarFormulario()">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="mensaje" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Comunidades registradas</h5>
        </div>

        <div class="card-body table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Ubicación</th>
                        <th>Familias</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaComunidades"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="/js/comunidades.js"></script>
</body>
</html>
