
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCCVI - Restablecer contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center text-primary">SCCVI</h3>

                    <p class="text-center text-muted">
                        Sistema de Control de Crecimiento
                        y Vacunación Infantil
                    </p>

                    <h5 class="text-center mb-3">
                        Restablecer contraseña
                    </h5>

                    <p class="text-muted text-center small">
                        Ingresa tu nueva contraseña.
                        Debe contener al menos 08 caracteres.
                    </p>

                    <div id="mensaje" role="alert" aria-live="polite"></div>

                    <form id="formRestablecer">
                        <div class="mb-3">
                            <label for="contrasena" class="form-label">
                                Nueva contraseña
                            </label>
                            <input
                                type="password"
                                id="contrasena"
                                class="form-control"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="confirmarContrasena" class="form-label">
                                Confirmar contraseña
                            </label>
                            <input
                                type="password"
                                id="confirmarContrasena"
                                class="form-control"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            id="btnRestablecer"
                            class="btn btn-primary w-100">
                            Cambiar contraseña
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none small">
                            Volver al inicio de sesión
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/restablecer-contrasena.js"></script>
</body>
</html>
