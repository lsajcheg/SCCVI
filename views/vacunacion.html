
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Vacunación Infantil</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="/" class="navbar-brand">SCCVI</a>
        <span class="text-white">Gestión de Vacunación</span>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" role="alert"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Registro de Vacunación Infantil</h5>
        </div>

        <div class="card-body">
            <form id="formVacunacion">

                <input type="hidden" id="id_registro_vacuna">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Seleccionar niño *
                        </label>

                        <select id="id_nino"
                                class="form-select" required>
                            <option value="">
                                Seleccione un niño
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vacuna *</label>

                        <select id="id_vacuna"
                                class="form-select" required>
                            <option value="">
                                Seleccione una vacuna
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Número de dosis *
                        </label>

                        <select id="id_esquema"
                                class="form-select" required>
                            <option value="">
                                Seleccione una dosis
                            </option>
                        </select>

                        <small class="text-muted"
                               id="detalleDosis"></small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Fecha de aplicación *
                        </label>

                        <input type="date"
                               id="fecha_aplicacion"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Próxima dosis
                        </label>

                        <input type="date"
                               id="proxima_dosis"
                               class="form-control">

                        <small class="text-muted">
                            Opcional. No se calcula automáticamente.
                        </small>
                    </div>

                    <div class="col-12">
                        <label class="form-label">
                            Observaciones
                        </label>

                        <textarea id="observaciones"
                                  class="form-control"
                                  rows="3"></textarea>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit"
                            class="btn btn-primary">
                        Guardar vacunación
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            onclick="limpiarFormulario()">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Historial de Vacunación</h5>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">
                    Filtrar historial por niño
                </label>

                <select id="filtroNino"
                        class="form-select">
                    <option value="">Todos los niños</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Niño</th>
                            <th>Vacuna</th>
                            <th>Dosis</th>
                            <th>Aplicación</th>
                            <th>Próxima dosis</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaVacunacion"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="/js/vacunacion.js"></script>
</body>
</html>
