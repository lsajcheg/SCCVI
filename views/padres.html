
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Padres de Familia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="/" class="navbar-brand">SCCVI</a>
        <span class="text-white">Gestión de Padres</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Registro de Padres de Familia</h5>
        </div>

        <div class="card-body">
            <form id="formPadre">
                <input type="hidden" id="id_padre">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombres *</label>
                        <input type="text" id="nombres"
                               class="form-control" maxlength="100" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" id="apellidos"
                               class="form-control" maxlength="100" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">DPI</label>
                        <input type="text" id="dpi"
                               class="form-control"
                               maxlength="13" pattern="[0-9]{13}"
                               inputmode="numeric">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Teléfono</label>
                        <input type="tel" id="telefono"
                               class="form-control" maxlength="20">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="correo"
                               class="form-control" maxlength="150">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Comunidad</label>
                        <select id="id_comunidad" class="form-select">
                            <option value="">Seleccione comunidad</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Canal de notificación
                        </label>
                        <select id="canal_notificacion"
                                class="form-select">
                            <option value="">Seleccione canal</option>
                            <option value="email">Correo electrónico</option>
                            <option value="telegram">Telegram</option>
                            <option value="whatsapp">WhatsApp</option>
                        </select>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Guardar
                    </button>
                    <button type="button" class="btn btn-secondary"
                            onclick="limpiarFormulario()">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div id="mensaje" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Padres registrados</h5>
        </div>

        <div class="card-body table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre completo</th>
                        <th>DPI</th>
                        <th>Teléfono</th>
                        <th>Comunidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPadres"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="/js/padres.js"></script>
</body>
</html>
