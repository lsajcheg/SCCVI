
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Administración de Usuarios</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>Administración de Usuarios</h3>
            <p class="text-muted mb-0">
                Gestión de cuentas y roles del sistema.
            </p>
        </div>

        <button class="btn btn-primary"
                id="btnNuevo">
            + Nuevo Usuario
        </button>
    </div>

    <div id="mensaje"></div>

    <!-- FORMULARIO -->
    <div class="card shadow-sm mb-4 d-none" id="panelFormulario">
        <div class="card-header">
            <strong id="tituloFormulario">
                Registrar Usuario
            </strong>
        </div>

        <div class="card-body">
            <form id="formUsuario">
                <input type="hidden" id="idUsuario">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombres</label>
                        <input type="text"
                               class="form-control"
                               id="nombres"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text"
                               class="form-control"
                               id="apellidos"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Usuario</label>
                        <input type="text"
                               class="form-control"
                               id="usuario"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email"
                               class="form-control"
                               id="correo"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol</label>
                        <select class="form-select"
                                id="idRol"
                                required>
                            <option value="">Seleccione un rol</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" id="labelContrasena">
                            Contraseña
                        </label>
                        <input type="password"
                               class="form-control"
                               id="contrasena"
                               minlength="8"
                               autocomplete="new-password">
                        <small class="text-muted" id="ayudaContrasena">
                            Mínimo 8 caracteres.
                        </small>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-success"
                            id="btnGuardar">
                        Guardar
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            id="btnCancelar">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLA -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre completo</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <tr>
                            <td colspan="7" class="text-center">
                                Cargando usuarios...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="/js/usuarios.js"></script>
</body>
</html>
