
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Recuperar contraseña</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light d-flex align-items-center"
      style="min-height:100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center text-primary">
                        SCCVI
                    </h3>

                    <p class="text-center text-muted">
                        Sistema de Control de Crecimiento
                        y Vacunación Infantil
                    </p>

                    <h5 class="text-center mb-3">
                        Recuperar contraseña
                    </h5>

                    <p class="text-muted text-center small">
                        Ingresa el correo electrónico
                        registrado en tu cuenta.
                        Te enviaremos un enlace para
                        restablecer tu contraseña.
                    </p>

                    <div id="mensaje" role="alert"></div>

                    <form id="formRecuperacion">

                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                class="form-control"
                                placeholder="correo@ejemplo.com"
                                autocomplete="email"
                                maxlength="254"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            id="btnRecuperar"
                            class="btn btn-primary w-100">
                            Enviar enlace de recuperación
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <a href="/login"
                           class="text-decoration-none small">
                            Volver al inicio de sesión
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="/js/olvide-contrasena.js"></script>

</body>
</html>
