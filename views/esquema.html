
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SCCVI - Esquema de Vacunación</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="/" class="navbar-brand">SCCVI</a>
        <span class="text-white">Esquema de Vacunación</span>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" role="alert"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Administración de Dosis</h5>
        </div>

        <div class="card-body">
            <form id="formEsquema">

                <input type="hidden" id="id_esquema">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Vacuna *
                        </label>

                        <select
                            id="id_vacuna"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Seleccione una vacuna
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">
                            Número de dosis *
                        </label>

                        <input
                            type="number"
                            id="numero_dosis"
                            class="form-control"
                            min="1"
                            max="50"
                            step="1"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">
                            Edad recomendada (meses) *
                        </label>

                        <input
                            type="number"
                            id="edad_recomendada_meses"
                            class="form-control"
                            min="0"
                            max="240"
                            step="1"
                            required
                        >
                    </div>

                    <div class="col-12">
                        <label class="form-label">
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            class="form-control"
                            rows="3"
                            placeholder="Ej. Dosis de refuerzo"
                        ></textarea>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit"
                            class="btn btn-primary">
                        Guardar dosis
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            onclick="limpiarFormulario()">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Dosis Registradas</h5>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">
                    Filtrar por vacuna
                </label>

                <select id="filtroVacuna"
                        class="form-select">
                    <option value="">Todas las vacunas</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Vacuna</th>
                            <th>Dosis</th>
                            <th>Edad (meses)</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaEsquema"></tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="mt-3 mb-4 d-flex gap-2 flex-wrap">
        <a href="/vacunas" class="btn btn-outline-primary">
            Catálogo de Vacunas
        </a>

        <a href="/vacunacion" class="btn btn-outline-primary">
            Registro de Vacunación
        </a>
    </div>

</div>

<script src="/js/esquema.js"></script>
</body>
</html>
