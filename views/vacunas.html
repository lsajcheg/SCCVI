
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>SCCVI - Catálogo de Vacunas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">SCCVI</a>
        <span class="text-white">Catálogo de Vacunas</span>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" role="alert"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Administración de Vacunas</h5>
        </div>

        <div class="card-body">
            <form id="formVacuna">

                <input type="hidden" id="id_vacuna">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Nombre de la vacuna *
                        </label>
                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            maxlength="150"
                            required
                            placeholder="Ej. BCG"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Estado
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            value="Activa al registrar"
                            readonly
                        >
                    </div>

                    <div class="col-12">
                        <label class="form-label">
                            Descripción
                        </label>
                        <textarea
                            id="descripcion"
                            class="form-control"
                            rows="3"
                            placeholder="Descripción de la vacuna"
                        ></textarea>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit"
                            class="btn btn-primary">
                        Guardar vacuna
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            onclick="limpiarFormulario()">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Vacunas Registradas</h5>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <input
                    type="search"
                    id="buscarVacuna"
                    class="form-control"
                    placeholder="Buscar vacuna por nombre"
                >
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaVacunas"></tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="mt-3 mb-4">
        <a href="/vacunacion" class="btn btn-outline-primary">
            Ir a Registro de Vacunación
        </a>
    </div>

</div>

<script src="/js/vacunas.js"></script>
</body>
</html>
